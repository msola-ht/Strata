# Keep this fork on top of upstream (Niko1221/Strata), whatever upstream does: every run takes upstream/main as
# it is, brings it into main, merges main into dev, and replays the patch branches on top of it. Nothing here
# decides whether an upstream move is worth taking - a run with nothing new is a no-op, a run after an upstream
# push moves the branches. A patch branch that stops on a conflict ends the run; that rebase is finished by
# hand, and the next run starts from the branches as they are then.
#
# main is upstream's main plus this file, so the merge is a fast-forward until something else is added to main
# here. The patch branches are rewritten (rebase), so they are pushed with --force-with-lease; dev is merged
# instead, so the pull requests that land in dev keep a base that never moves under them. Everything is pushed
# with the workflow's own token, and a push with that token starts no workflow: this cannot loop.
#
# dev is this fork's own branch: the fork's own commits live there and reach main only as patch branches that
# were asked for by hand. PATCH_BRANCHES is empty until one of those exists again.
name: sync-upstream

on:
  schedule:
    - cron: "7,22,37,52 * * * *"           # every 15 minutes; GitHub may delay or drop scheduled runs
  workflow_dispatch:                      # or by hand: Actions -> sync-upstream -> Run workflow
    inputs:
      branches:
        description: "patch branches to replay on main, space separated"
        required: false
        default: ""

permissions:
  contents: write                         # pushing main, dev and the rebased patch branches back to the fork

concurrency:
  group: sync-upstream                    # one sync at a time; a queued run waits, it does not cancel
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/Niko1221/Strata.git
  PATCH_BRANCHES: ""                      # no patch branch for now: dev carries the fork's own commits

jobs:
  sync-main:
    name: Sync main with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      main_sha: ${{ steps.sync.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: fetch upstream
        run: |
          git config user.name  "strata-sync"
          git config user.email "strata-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --prune upstream
          echo "upstream/main = $(git rev-parse --short upstream/main)"

      - name: bring main up to upstream
        id: sync
        run: |
          git checkout main
          before=$(git rev-parse HEAD)
          upstream=$(git rev-parse upstream/main)
          # A plain merge: a fast-forward while this fork's main holds nothing upstream does not, and a merge
          # commit once it holds this file too. Upstream history that shares no commit with ours (the 2026-10-06
          # cleanup, #1276) stops here on purpose: that one is a by-hand job.
          if ! git merge --no-edit upstream/main; then
            echo "::error::main cannot be merged with upstream/main - resolve it by hand (see #1276)"
            exit 1
          fi
          git push origin main
          after=$(git rev-parse HEAD)
          git fetch origin main
          git merge-base --is-ancestor "$after" origin/main
          git merge-base --is-ancestor "$upstream" origin/main
          echo "main_sha=$after" >> "$GITHUB_OUTPUT"
          {
            echo "### main synced"
            echo "Before: $before"
            echo "Upstream fetched: $upstream"
            echo "After: $after"
            echo "Verified: origin/main contains the fetched upstream commit."
          } >> "$GITHUB_STEP_SUMMARY"

  replay-patches:
    name: Replay patch branches
    needs: sync-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: replay the patch branches on main
        env:
          BRANCHES: ${{ inputs.branches }}
          SYNCED_MAIN: ${{ needs.sync-main.outputs.main_sha }}
        run: |
          set -euo pipefail
          git config user.name "strata-sync"
          git config user.email "strata-sync@users.noreply.github.com"
          git rev-parse --verify "$SYNCED_MAIN^{commit}"
          read -r -a branches <<< "${BRANCHES:-$PATCH_BRANCHES}"
          for branch in "${branches[@]}"; do
            git check-ref-format "refs/heads/$branch"
            if [[ "$branch" == main || "$branch" == -* ]]; then
              echo "::error::only patch branches may be replayed"
              exit 1
            fi
            echo "== $branch"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            old=$(git rev-parse "refs/remotes/origin/$branch")
            git checkout --detach "$old"
            if ! git rebase "$SYNCED_MAIN"; then
              git rebase --abort
              {
                echo "### $branch: the rebase stopped"
                echo
                echo "main was synced to \`$SYNCED_MAIN\`, but $branch does not replay cleanly on it."
                echo "$branch was not pushed: it still points at \`$old\`."
                echo
                echo "Finish it by hand:"
                echo
                echo '```'
                echo "git fetch origin"
                echo "git checkout $branch"
                echo "git rebase origin/main                 # resolve, git add, git rebase --continue"
                echo "git push --force-with-lease origin $branch"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$branch did not replay on upstream - resolve it by hand (see the run summary)"
              exit 1
            fi
            after=$(git rev-parse HEAD)
            git push --force-with-lease="refs/heads/$branch:$old" origin "HEAD:refs/heads/$branch"
            remote=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            if [[ "$remote" != "$after" ]]; then
              echo "::error::the remote patch branch changed after the push; inspect it before retrying"
              exit 1
            fi
            {
              echo "### $branch synced"
              echo "Before: $old"
              echo "After: $after"
              echo "Base: $SYNCED_MAIN"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "== $branch: $old -> $after"
          done

  sync-dev:
    name: Merge main into dev
    needs: sync-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: merge main into dev
        run: |
          set -euo pipefail
          git config user.name "strata-sync"
          git config user.email "strata-sync@users.noreply.github.com"
          git fetch origin main dev
          git checkout dev
          before=$(git rev-parse HEAD)
          synced_main=$(git rev-parse origin/main)
          # A plain merge: dev is the fork's own integration branch, so its commits are never rewritten and a
          # pull request that was merged into it stays valid. The patch branches above are rebased instead.
          if ! git merge --no-edit origin/main; then
            git merge --abort
            {
              echo "### dev: main did not merge"
              echo
              echo "main is at \`$synced_main\`, and dev does not merge it cleanly."
              echo "dev was not pushed: it still points at \`$before\`."
              echo
              echo "Finish it by hand:"
              echo
              echo '```'
              echo "git fetch origin"
              echo "git switch dev"
              echo "git merge origin/main                  # resolve, git add, git commit"
              echo "git push origin dev"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::dev does not merge main - resolve it by hand (see the run summary)"
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [[ "$after" != "$before" ]]; then
            git push origin dev
          fi
          git fetch origin dev
          git merge-base --is-ancestor "$after" origin/dev
          git merge-base --is-ancestor "$synced_main" origin/dev
          {
            echo "### dev merged"
            echo "Before: $before"
            echo "main: $synced_main"
            echo "After: $after"
            echo "Verified: origin/dev contains the fetched main commit."
          } >> "$GITHUB_STEP_SUMMARY"
